name: Testes Godot

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Instalar Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Importar recursos e verificar scripts
        run: godot --headless --editor --path . --quit --verbose
      - name: Executar teste de combate
        run: godot --headless --path . --script res://tests/smoke_test.gd
